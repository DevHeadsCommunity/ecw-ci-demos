<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc">
<title id="title">03 · BME280 HIL · 50 samples</title><desc id="desc">Four manually triggered RA6 CI demos using ECW booking, explicit flashing and result artifacts.</desc>
<rect width="100%" height="100%" fill="#0b1220"/><g font-family="DejaVu Sans, Arial, sans-serif" fill="#edf3ff"><text x="36" y="52" font-size="30" fill="#e9bc69" font-weight="bold">03 · BME280 HIL · 50 samples</text><text x="36" y="88" font-size="21" fill="#a9b9cf" font-weight="normal">demo/ra6-hil-50-samples</text><rect x="36" y="120" width="1028" height="270" rx="16" fill="#131f33" stroke="#e9bc69"/><text x="58" y="154" font-size="23" fill="#e9bc69" font-weight="bold">03 · BME280 HIL · 50 samples</text><text x="58" y="182" font-size="16" fill="#a9b9cf" font-weight="normal">demo/ra6-hil-50-samples</text><text x="58" y="220" font-size="17" fill="#edf3ff" font-weight="normal">Select BME280 → prepare → wait active (≤180 s)</text><text x="58" y="252" font-size="17" fill="#edf3ff" font-weight="normal">Frontend-format CSV: 50 rows → 150 verified words</text><text x="58" y="284" font-size="17" fill="#edf3ff" font-weight="normal">Upload RA6 HEX → explicit flash → ticket console</text><text x="58" y="316" font-size="17" fill="#edf3ff" font-weight="normal">Read chip ID 0x60 and 50 T/H/P SPI samples</text><text x="58" y="348" font-size="17" fill="#edf3ff" font-weight="normal">Compare a complete CSV cycle; stale data fails</text><text x="36" y="435" font-size="21" fill="#edf3ff" font-weight="normal">Manual workflow_dispatch → exclusive RA6 booking → artifacts → release</text><text x="36" y="548" font-size="18" fill="#a9b9cf" font-weight="normal">Backend and RM manage all board access. No direct serial device or runner-side west flash.</text></g></svg>
