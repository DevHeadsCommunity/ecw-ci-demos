<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc">
<title id="title">04 · Zephyr Twister HIL</title><desc id="desc">Four manually triggered RA6 CI demos using ECW booking, explicit flashing and result artifacts.</desc>
<rect width="100%" height="100%" fill="#0b1220"/><g font-family="DejaVu Sans, Arial, sans-serif" fill="#edf3ff"><text x="36" y="52" font-size="30" fill="#be9aff" font-weight="bold">04 · Zephyr Twister HIL</text><text x="36" y="88" font-size="21" fill="#a9b9cf" font-weight="normal">demo/ra6-zephyr-twister</text><rect x="36" y="120" width="1028" height="270" rx="16" fill="#131f33" stroke="#be9aff"/><text x="58" y="154" font-size="23" fill="#be9aff" font-weight="bold">04 · Zephyr Twister HIL</text><text x="58" y="182" font-size="16" fill="#a9b9cf" font-weight="normal">demo/ra6-zephyr-twister</text><text x="58" y="220" font-size="17" fill="#edf3ff" font-weight="normal">GitHub: compile suite and Twister build-only check</text><text x="58" y="252" font-size="17" fill="#edf3ff" font-weight="normal">API job: twister.run profile ci_twister_test</text><text x="58" y="284" font-size="17" fill="#edf3ff" font-weight="normal">Trusted backend profile → Twister → pytest → RM</text><text x="58" y="316" font-size="17" fill="#edf3ff" font-weight="normal">Flash once → identify → 5 nonce echoes → uptime</text><text x="58" y="348" font-size="17" fill="#edf3ff" font-weight="normal">Require passed case + exit 0 + JSON/JUnit reports</text><text x="36" y="435" font-size="21" fill="#edf3ff" font-weight="normal">Manual workflow_dispatch → exclusive RA6 booking → artifacts → release</text><text x="36" y="477" font-size="20" fill="#e9bc69" font-weight="normal">Trusted server profile owns the hardware build and flash; GitHub does not flash twice.</text><text x="36" y="548" font-size="18" fill="#a9b9cf" font-weight="normal">Backend and RM manage all board access. No direct serial device or runner-side west flash.</text></g></svg>
