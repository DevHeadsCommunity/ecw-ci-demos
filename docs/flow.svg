<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc">
<title id="title">02 · Hello + serial</title><desc id="desc">Four manually triggered RA6 CI demos using ECW booking, explicit flashing and result artifacts.</desc>
<rect width="100%" height="100%" fill="#0b1220"/><g font-family="DejaVu Sans, Arial, sans-serif" fill="#edf3ff"><text x="36" y="52" font-size="30" fill="#78aaff" font-weight="bold">02 · Hello + serial</text><text x="36" y="88" font-size="21" fill="#a9b9cf" font-weight="normal">demo/ra6-hello-serial</text><rect x="36" y="120" width="1028" height="270" rx="16" fill="#131f33" stroke="#78aaff"/><text x="58" y="154" font-size="23" fill="#78aaff" font-weight="bold">02 · Hello + serial</text><text x="58" y="182" font-size="16" fill="#a9b9cf" font-weight="normal">demo/ra6-hello-serial</text><text x="58" y="220" font-size="17" fill="#edf3ff" font-weight="normal">Build RA6 HEX → upload to NFS → explicit flash</text><text x="58" y="252" font-size="17" fill="#edf3ff" font-weight="normal">CI job: mcu.serial_log, duration 5000 ms</text><text x="58" y="284" font-size="17" fill="#edf3ff" font-weight="normal">Download hello.log from the job artifact ZIP</text><text x="58" y="316" font-size="17" fill="#edf3ff" font-weight="normal">Require ≥4 consecutive numbered RA6 greetings</text><text x="58" y="348" font-size="17" fill="#edf3ff" font-weight="normal">Preserve job metadata, results and diagnostic logs</text><text x="36" y="435" font-size="21" fill="#edf3ff" font-weight="normal">Manual workflow_dispatch → exclusive RA6 booking → artifacts → release</text><text x="36" y="548" font-size="18" fill="#a9b9cf" font-weight="normal">Backend and RM manage all board access. No direct serial device or runner-side west flash.</text></g></svg>
